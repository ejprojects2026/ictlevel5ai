<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VTA ICT L5 Community Feed — share posts, discuss ICT topics, and connect with fellow students.">
  <title>Community Feed · VTA ICT L5</title>
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <!-- Community page specific styles -->
  <link rel="stylesheet" href="assets/css/community.css">
</head>

<body>
  <!-- Navbar (exactly as /) -->
  <nav class="navbar">
    <div class="container">
      <div class="logo">VTA ICT L5 Community</div>
      <button class="mobile-menu-btn" aria-label="Menu">☰</button>
      <div class="nav-menu">
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="lesson">Notes</a></li>
          <li><a href="papers">Papers</a></li>
          <li><a href="teacher">AI Teacher</a></li>
          <li><a href="community" style="color: var(--primary-color);">Community</a></li>
        </ul>
        <div class="nav-buttons">
          <a href="add-notes" class="btn btn-outline">Add Notes</a>
          <button id="theme-toggle" class="btn" aria-label="Toggle theme">☀️</button>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="container feed-container">
      <!-- Feed will be injected here by JavaScript -->
      <div id="community-feed" class="community-feed">
        <div class="loading-indicator">Loading posts...</div>
      </div>
    </div>

    <!-- Floating create button → opens community-upload.html -->
    <a href="community-upload.html" class="floating-create-btn" aria-label="Create new post">+</a>
  </main>

  <!-- Footer (same as index) -->
  <footer class="footer" id="siteFooter">
    <div class="container">
      <p>© 2026 VTA ICT L5 Community. All rights reserved.</p>
      <p>VTA ICT Level 5 Community — Academic excellence through collaboration.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/community.js"></script>
  <script>
    /* Hide footer inside Android WebView */
    (function () {
      var ua = navigator.userAgent || '';
      if (ua.includes('wv') || ua.includes('Median')) {
        var footer = document.getElementById('siteFooter');
        if (footer) footer.style.display = 'none';
      }
    })();
  </script>
</body>

</html>
